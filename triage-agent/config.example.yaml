# === Triage Agent Config (template) ===
# Copy this to config.yaml and adjust paths/devices for your machine.

asr:
  backend: "faster-whisper"
  model_size: "tiny"                # fast model for real-time partials
  final_model_size: "base"          # larger, more accurate model for one-time final transcription
  device: "cpu"                     # GPU may cause VRAM contention with the SLM on constrained cards
  compute_type: "int8"
  language: "en"
  input_device: 0                   # run `python -c "import sounddevice as sd; print(sd.query_devices())"` to find yours
  partial_emit_interval_ms: 500
  vad_silence_ms: 500

slm:
  backend: "ollama"
  model_name: "qwen3.5:4b"
  max_new_tokens: 200
  temperature: 0.3
  num_ctx: 3072                         # context window allowed for SLM (3000 range)
  max_history_messages: 24              # keep up to 12 full user-nurse dialogue rounds
  use_lookahead: true                   # Phase 4: Zero-VRAM Lookahead Jacobi Speculation
  lookahead_depth: 8                    # K token depth for Jacobi rollout
  lookahead_branches: 3                 # B branches per node
  lookahead_max_candidates: 12          # Max candidate sequences in L2 cache budget
  bild_entropy_threshold: 0.15          # BiLD fallback entropy threshold (Delta p < 0.15)
  speculative_pre_emission: true        # Phase 4: Speculative Acoustic Pre-Emission
  use_snapkv: true                      # Phase 5: SnapKV Attention Anchor Pruning & Cache Compression
  snapkv_observation_window: 48         # Tokens for recent observation window (DuoAttention streaming heads)
  snapkv_max_tokens: 512                # Max history tokens under compression
  snapkv_trigger_turn_threshold: 4      # Turns before compression activates

tts:
  backend: "piper"
  voice_model: "models/tts/en_US-lessac-medium.onnx"  # set to your absolute path
  sample_rate: 22050

pipeline:
  mode: "sequential"                # "sequential" | "speculative"
  max_vram_gb: 4                    # set to your GPU's actual VRAM
  keyboard_interrupt_enabled: true  # requires running via `python -m src.pipeline`, not Jupyter

cv:
  enabled: false                    # requires opencv-python; set true to enable presence gating
  camera_index: 0
  check_interval_s: 1.0
  absence_grace_s: 5.0
  cascade_path: null                # set to an absolute path if your opencv-python doesn't bundle the cascade file

speculative:
  divergence_threshold: 0.7         # commit if similarity >= threshold, else rollback and regenerate

hospital:
  enabled: true                     # sub-millisecond selective room routing
  directory_path: "eval/data/hospital_directory.json"
  match_threshold: 0.25
  top_k: 3

logging:
  level: "INFO"
  log_dir: "experiments/logs"
